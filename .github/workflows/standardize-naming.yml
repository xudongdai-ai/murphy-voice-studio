name: Standardize repository naming
on:
  push:
    paths:
      - english-metadata-update.zip
      - .github/workflows/standardize-naming.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified English naming update
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import zipfile, json, os
          root = Path.cwd().resolve()
          package = root / "english-metadata-update.zip"
          def safe_path(name):
              target = (root / name).resolve()
              if not target.is_relative_to(root) or ".git" in Path(name).parts:
                  raise SystemExit("Unsafe package path")
              return target
          with zipfile.ZipFile(package) as archive:
              removed = json.loads(archive.read("removed-paths.json"))
              for name in removed:
                  safe_path(name)
              for item in archive.infolist():
                  safe_path(item.filename)
              for name in removed:
                  safe_path(name).unlink()
              for item in archive.infolist():
                  if item.filename == "removed-paths.json":
                      continue
                  target = safe_path(item.filename)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(item))
                  mode = (item.external_attr >> 16) & 0o777
                  if mode:
                      os.chmod(target, mode)
          package.unlink()
          (root / ".github/workflows/standardize-naming.yml").unlink()
          PYTHON
          git config user.name "MurphyProd1"
          git config user.email "249086763+xudongdai-ai@users.noreply.github.com"
          git add --all --force
          git commit -m "Standardize English project metadata and macOS launcher naming"
          git push origin HEAD:main
